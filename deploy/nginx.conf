user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log crit;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    server {
        listen 80 default_server;
        server_name _;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
    }
}
